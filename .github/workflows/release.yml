# Build and publish a release when a version tag is pushed.
#
# The point of doing this in CI rather than locally: electron-builder needs a
# credential to create the release and upload the 136 MB asset, and the only
# safe place for one is a token the platform issues to the job itself. GITHUB_TOKEN
# is minted per run, scoped to this repository, and expires when the job ends —
# nothing is pasted into a shell, nothing is stored on a laptop, nothing to leak.
#
# To cut a release:  npm version patch  &&  git push --follow-tags
name: Release

on:
  push:
    tags:
      - 'v*'

# electron-builder creates a release and uploads assets, which is a write.
# Without this the default token is read-only and the publish step 403s.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fetch a PINNED static build rather than using whatever is on the runner.
      #
      # v0.1.1 and v0.1.2 shipped broken because this step trusted PATH. Chocolatey
      # installs ffmpeg as a 383 KB SHIM — a launcher that locates the real binary
      # by a path relative to its own install root. `ffmpeg -version` passed here,
      # because a shim works where it lives; stage-ffmpeg.mjs then copied the shim
      # into the installer, where it looked for `..\lib\ffmpeg\...` beside the app
      # and died. Every import failed with an ffprobe error on a green build.
      #
      # A pinned URL also makes the release reproducible and matches the build the
      # app is developed against, so codec coverage cannot quietly differ between
      # a local build and a published one.
      - name: Fetch pinned ffmpeg
        shell: pwsh
        run: |
          # A dated BtbN autobuild: an immutable GitHub release asset, so this
          # URL resolves to the same bytes forever. Verified to return 200 before
          # being written here — the previous attempt pinned a gyan.dev packages
          # URL from memory that 404s, which failed the whole release.
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-08-13-06/ffmpeg-N-125994-gf944afd040-win64-gpl.zip'
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $out = "$env:RUNNER_TEMP\ffmpeg"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $bin = (Get-ChildItem -Path $out -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          if (-not $bin) { Write-Error 'ffmpeg.exe not found in the archive'; exit 1 }
          # Size is the cheap tell: a real static ffmpeg is tens of MB, a shim is under one.
          $size = (Get-Item "$bin\ffmpeg.exe").Length
          Write-Host "ffmpeg.exe is $([math]::Round($size/1MB,1)) MB at $bin"
          if ($size -lt 10MB) { Write-Error "That is a shim or wrapper, not a real build"; exit 1 }
          & "$bin\ffmpeg.exe" -version | Select-Object -First 1
          & "$bin\ffprobe.exe" -version | Select-Object -First 1
          # stage-ffmpeg.mjs reads this, and verifies the STAGED copy runs.
          "FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci

      # The same gates that guard local work. A release that skips them is how a
      # broken build reaches users.
      - name: Typecheck
        run: npm run typecheck

      - name: Contract and guard checks
        run: npm run check

      # The tag is what triggered this run; package.json is what electron-builder
      # writes into latest.yml. If they disagree the updater looks for an asset
      # that was never uploaded and reports "no update" forever.
      - name: Tag matches package.json version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=$tag package.json=$pkg"
          if ($tag -ne $pkg) {
            Write-Error "Tag $tag does not match package.json $pkg. Use 'npm version' so the two are written together."
            exit 1
          }

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      # Kept for inspection when a release looks wrong; the release itself is
      # what users get.
      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-release/*.exe
            dist-release/latest.yml
          retention-days: 14
