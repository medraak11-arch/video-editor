# ---------------------------------------------------------------------------
# electron-builder.yml — how "Video Editor" becomes something you can install.
#
# Kept out of package.json so the decisions can carry their reasons. Every
# non-default value below is here because of something specific about this app;
# nothing is copied from a template.
#
# Build it with `npm run dist`. Output lands in dist-release/.
# ---------------------------------------------------------------------------

appId: dev.local.videoeditor
productName: Video Editor
copyright: © 2026

directories:
  output: dist-release
  buildResources: build

# The renderer is a Vite bundle and the main process is tsc output; every runtime
# dependency is already inside dist/. Nothing in electron/ imports a package —
# only 'electron' itself and node builtins — so node_modules is 240 MB of
# nothing and is excluded outright.
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!node_modules/**'
  - '!**/*.map'

# ffmpeg and ffprobe, staged by scripts/stage-ffmpeg.mjs. This lands at
# <install dir>/resources/ffmpeg/, which is the first place electron/ffmpeg.ts
# looks. `npm run dist:nobundle` empties the folder and ships without them.
extraResources:
  - from: build/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'

# Package against the Electron already in node_modules rather than re-downloading
# the same 270 MB from GitHub. It also means a build cannot silently use a
# different Electron than `npm start` and `npm run dev` do.
electronDist: node_modules/electron/dist

# Nothing here is native, so there is nothing to rebuild and no reason to spend
# the time checking.
npmRebuild: false
buildDependenciesFromSource: false

# Double-clicking a .veproj opens it. Without this entry the OS has no reason to
# hand the file to this app at all, and main.ts's argv / 'open-file' handling
# would only ever be reachable from a command line.
#
# `icon:` is also what electron-builder would find by convention at
# ${buildResources}/veproj.ico. It is written out anyway: a convention that
# works by accident is a convention that breaks silently. build/installer.nsh
# broadcasts SHCNE_ASSOCCHANGED after the association is registered, without
# which an upgrade keeps the old DefaultIcon in Explorer's cache until logoff.
fileAssociations:
  - ext: veproj
    name: Video Editor project
    description: Video Editor project
    role: Editor
    icon: build/veproj.ico

win:
  # Not build/icon.png. Pointed at a PNG, electron-builder generates the .ico
  # itself and every entry is a downscale of one bitmap, which throws away the
  # seven separately authored sizes in docs/ICON.md §3. scripts/make-icon.mjs
  # writes this file, and verifies it by reading it back.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# Per-user, not per-machine: this is a personal tool, and a per-user install
# needs no UAC prompt and no administrator. The installer is not one-click —
# a 300 MB install that starts before you have agreed to a location is rude.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Video Editor
  # Projects, window layout and theme live in userData. An uninstall removes the
  # program; it does not remove your work.
  deleteAppDataOnUninstall: false
  artifactName: ${productName} ${version} Setup.${ext}

portable:
  artifactName: ${productName} ${version} Portable.${ext}
