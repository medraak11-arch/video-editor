# ---------------------------------------------------------------------------
# electron-builder.yml — how "Video Editor" becomes something you can install.
#
# Kept out of package.json so the decisions can carry their reasons. Every
# non-default value below is here because of something specific about this app;
# nothing is copied from a template.
#
# Build it with `npm run dist`. Output lands in dist-release/.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# UPDATE FEED — the one place the update endpoint is configured.
#
# This key is what electron-builder turns into resources/app-update.yml, which
# is the only thing electron-updater reads at runtime. docs/RELEASE.md §1.2.
#
# `null` is not "unset": it is an EXPLICIT instruction not to publish, and it is
# load-bearing. With NO publish key at all, electron-builder infers a GitHub
# provider from the git remote (or from package.json "repository") and writes an
# app-update.yml pointing at a repository that may not exist. The app would then
# have a feed nobody configured. Removing this line is a bug; changing it is the
# release decision.
#
# To ship updates, replace `null` with ONE of the two blocks below and read
# docs/RELEASE.md §1.10 before the first publish.
#
#   publish:
#     - provider: github
#       owner: <github-user-or-org>
#       repo: video-editor
#       releaseType: release        # not 'draft'; a draft release is invisible
#                                   # to the updater and looks like "no update"
#
#   publish:
#     - provider: generic
#       url: https://updates.example.com/video-editor/   # HTTPS ONLY — §1.9
#       channel: latest
# ---------------------------------------------------------------------------
publish: null

appId: dev.local.videoeditor
productName: Video Editor
copyright: © 2026

directories:
  output: dist-release
  buildResources: build

# The renderer is a Vite bundle and the main process is tsc output; every runtime
# dependency of the RENDERER is already inside dist/, so node_modules is
# excluded outright — with exactly one exception.
#
# electron-updater is a main-process dependency (docs/RELEASE.md §1.11) and it
# is `require`d, lazily, from electron/update.ts. '!node_modules/**' excludes
# everything not explicitly re-included, so a list that named electron-updater
# and stopped would produce an asar containing it and none of its dependency
# graph, and the first require would throw `Cannot find module 'fs-extra'` in
# main, at the moment the user pressed a button, with no UI path to report it.
# A partial list is worse than no feature, so the list is the full closure.
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!node_modules/**'
  # electron-updater's COMPLETE production closure — 16 packages, sorted,
  # machine-generated. Regenerate with:
  #     node scripts/check-release.mjs --write-deps
  # Never hand-edit: scripts/check-release.mjs re-resolves it and fails the
  # build on any difference (docs/RELEASE.md §1.11, §1.12 gate 1.5).
  - 'node_modules/argparse/**'
  - 'node_modules/builder-util-runtime/**'
  - 'node_modules/debug/**'
  - 'node_modules/electron-updater/**'
  - 'node_modules/fs-extra/**'
  - 'node_modules/graceful-fs/**'
  - 'node_modules/js-yaml/**'
  - 'node_modules/jsonfile/**'
  - 'node_modules/lazy-val/**'
  - 'node_modules/lodash.escaperegexp/**'
  - 'node_modules/lodash.isequal/**'
  - 'node_modules/ms/**'
  - 'node_modules/sax/**'
  - 'node_modules/semver/**'
  - 'node_modules/tiny-typed-emitter/**'
  - 'node_modules/universalify/**'
  - '!**/*.map'

# ffmpeg and ffprobe, staged by scripts/stage-ffmpeg.mjs. This lands at
# <install dir>/resources/ffmpeg/, which is the first place electron/ffmpeg.ts
# looks. `npm run dist:nobundle` empties the folder and ships without them.
extraResources:
  - from: build/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'

# Package against the Electron already in node_modules rather than re-downloading
# the same 270 MB from GitHub. It also means a build cannot silently use a
# different Electron than `npm start` and `npm run dev` do.
electronDist: node_modules/electron/dist

# Nothing here is native, so there is nothing to rebuild and no reason to spend
# the time checking.
npmRebuild: false
buildDependenciesFromSource: false

# Double-clicking a .veproj opens it. Without this entry the OS has no reason to
# hand the file to this app at all, and main.ts's argv / 'open-file' handling
# would only ever be reachable from a command line.
#
# `icon:` is also what electron-builder would find by convention at
# ${buildResources}/veproj.ico. It is written out anyway: a convention that
# works by accident is a convention that breaks silently. build/installer.nsh
# broadcasts SHCNE_ASSOCCHANGED after the association is registered, without
# which an upgrade keeps the old DefaultIcon in Explorer's cache until logoff.
fileAssociations:
  - ext: veproj
    name: Video Editor project
    description: Video Editor project
    role: Editor
    icon: build/veproj.ico

win:
  # Not build/icon.png. Pointed at a PNG, electron-builder generates the .ico
  # itself and every entry is a downscale of one bitmap, which throws away the
  # seven separately authored sizes in docs/ICON.md §3. scripts/make-icon.mjs
  # writes this file, and verifies it by reading it back.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# Per-user, not per-machine: this is a personal tool, and a per-user install
# needs no UAC prompt and no administrator. The installer is not one-click —
# a 300 MB install that starts before you have agreed to a location is rude.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Video Editor
  # Projects, window layout and theme live in userData. An uninstall removes the
  # program; it does not remove your work.
  deleteAppDataOnUninstall: false
  artifactName: ${productName} ${version} Setup.${ext}

portable:
  artifactName: ${productName} ${version} Portable.${ext}
